<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تحدي الكرة</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e7efe0;--bg2:#dfe9d7;--paper:#fbfcf7;--ink:#10261a;--mute:#566a5c;--line:#c5d3bd;--turf:#17633a;--board:#0d3b22;--chalk:#f5f7ee;--card:#f2c230;--bad:#cf3a40;--ok:#177a3d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07160e;--bg2:#0a1d12;--paper:#102b1c;--ink:#eef3e7;--mute:#9db6a4;--line:#25492f;--turf:#2fae5f;--board:#04230f;--chalk:#f5f7ee;--card:#ffd23f;--bad:#ff6b6b;--ok:#37c26e}}
:root[data-theme="dark"]{--bg:#07160e;--bg2:#0a1d12;--paper:#102b1c;--ink:#eef3e7;--mute:#9db6a4;--line:#25492f;--turf:#2fae5f;--board:#04230f;--chalk:#f5f7ee;--card:#ffd23f;--bad:#ff6b6b;--ok:#37c26e}
*{box-sizing:border-box}
html,body{margin:0}
body{background:repeating-linear-gradient(90deg,var(--bg) 0 48px,var(--bg2) 48px 96px);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:16px}
.app{width:100%;max-width:580px;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--turf);outline-offset:2px}
.kufi{font-family:"Reem Kufi","IBM Plex Sans Arabic",sans-serif}
.hero{position:relative;overflow:hidden;background:var(--board);color:var(--chalk);border-radius:20px;padding:30px 22px 28px}
.hero svg{position:absolute;inset:0;width:100%;height:100%;opacity:.2}
.hero>*{position:relative}
h1{margin:0;font-size:clamp(2.6rem,10vw,3.7rem);line-height:1.1;font-weight:700}
.hero p{margin:10px 0 0;color:rgba(245,247,238,.82);line-height:1.7}
.levels{display:grid;gap:10px}
.lvl{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;text-align:start;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px}
.lvl:hover{border-color:var(--turf)}
.lvl b{display:block;font-size:1.15rem}
.lvl small{color:var(--mute)}
.lvl .pts{font-weight:600;color:var(--turf)}
.lvl.mix{background:var(--card);border-color:transparent;color:#1d1a05}
.lvl.mix small,.lvl.mix .pts{color:#4a3f08}
.balls i{display:inline-block;width:11px;height:11px;border-radius:50%;border:2px solid var(--turf);margin-inline-end:3px}
.balls i.on{background:var(--turf)}
.mix .balls i{border-color:#1d1a05}.mix .balls i.on{background:#1d1a05}
.best{text-align:center;color:var(--mute);margin:2px 0 0}
.form{display:flex;gap:4px}
.form b{flex:1;height:8px;border-radius:3px;background:var(--line)}
.form .w{background:var(--ok)}.form .l{background:var(--bad)}.form .cur{background:var(--ink);opacity:.55}
.board{display:grid;grid-template-columns:1fr 1fr;background:var(--board);color:var(--chalk);border-radius:16px;overflow:hidden}
.cell{padding:10px 18px 12px}
.cell+.cell{border-inline-start:1px solid rgba(245,247,238,.16)}
.cell small{display:block;font-size:.82rem;opacity:.75}
.dig{font-family:"Reem Kufi",sans-serif;font-weight:700;font-size:2.4rem;line-height:1.15;font-variant-numeric:tabular-nums;direction:ltr;text-align:start;color:var(--card)}
.cell.low .dig{color:#ff7a7a}
.track{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:-6px}
.fill{height:100%;background:var(--turf);transition:width 1s linear}
.fill.low{background:var(--bad)}
.qcard{position:relative;overflow:hidden;background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:18px 18px 24px}
.qcard::after{content:"";position:absolute;inset-inline-start:-38px;bottom:-38px;width:76px;height:76px;border:2px solid var(--line);border-radius:50%}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{font-size:.85rem;padding:2px 11px;border-radius:20px;border:1px solid var(--line);color:var(--mute)}
.q{margin:0;font-size:1.3rem;font-weight:600;line-height:1.75;position:relative}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:start;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:11px 14px;font-size:1.05rem;line-height:1.5}
.k{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-family:"Reem Kufi",sans-serif;font-weight:700}
.opt:hover:not(:disabled){border-color:var(--turf)}
.opt:disabled{cursor:default}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.ok .k,.opt.bad .k{background:rgba(255,255,255,.22)}
.opt.dim{opacity:.55}
.msg{min-height:1.4em;margin:0;text-align:center;font-weight:600;color:var(--bad)}
.primary{background:var(--turf);color:#fff;border:0;border-radius:14px;padding:14px;font-weight:600;font-size:1.1rem}
.ghost{background:transparent;border:1.5px solid var(--line);border-radius:14px;padding:13px;font-weight:600}
.row{display:flex;gap:10px}.row>*{flex:1}
.hidden{display:none}
.final{text-align:center}
.final .dig{font-size:4rem;text-align:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:10px 4px}
.stats b{display:block;font-family:"Reem Kufi",sans-serif;font-size:1.5rem}
.stats span{font-size:.85rem;color:var(--mute)}
@media (prefers-reduced-motion:no-preference){.opt.bad{animation:sh .3s}@keyframes sh{25%{transform:translateX(5px)}75%{transform:translateX(-5px)}}}
.card2{background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:16px 18px}
.card2 h2{margin:0 0 10px;font-size:1.3rem;font-family:"Reem Kufi",sans-serif}
.how{margin:0;padding-inline-start:22px;line-height:1.9}
.pts3{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.pts3 span{border:1px solid var(--line);border-radius:20px;padding:3px 12px;font-size:.95rem}
.note{margin:10px 0 0;color:var(--mute);font-size:.92rem}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:10px 6px;border:1.5px solid var(--line);background:transparent;border-radius:12px;font-weight:600}
.seg button.on{background:var(--turf);border-color:var(--turf);color:#fff}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app"></div>

 opts.forEach((x,i)=>{const b=document.createElement("button");b.className="opt";b.innerHTML=`<span class="k">${LET[i]}</span><span>${x.t}</span>`;b.onclick=()=>pick(b,x.ok);b._ok=x.ok;o.appendChild(b)});
 clearInterval(timer);
 if(cfg.timer)timer=setInterval(()=>{st.t--;document.getElementById("tm").textContent=clk(st.t);
  const f=document.getElementById("f"),low=st.t<=5;f.style.width=(st.t/st.T*100)+"%";f.classList.toggle("low",low);document.getElementById("c1").classList.toggle("low",low);
  if(st.t<=0)pick(null,false)},1000);
}
function pick(btn,ok){
 if(st.done)return;st.done=true;clearInterval(timer);
 const it=st.list[st.i];
 document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(b._ok){b.classList.add("ok");b.querySelector(".k").textContent="✓"}else if(b!==btn)b.classList.add("dim")});
 if(ok){const bonus=cfg.timer?Math.round(st.t/st.T*LV[it.k].p*0.5):0;st.score+=LV[it.k].p+bonus;st.streak++;st.maxStreak=Math.max(st.maxStreak,st.streak);st.right++}
 else{st.streak=0;if(btn){btn.classList.add("bad");btn.querySelector(".k").textContent="✕"}else document.getElementById("msg").textContent="انتهى الوقت"}
 st.res[st.i]=ok;beep(ok?[660,880]:[220]);
 document.querySelectorAll(".form b")[st.i].className=ok?"w":"l";
 const nx=document.getElementById("nx");nx.classList.remove("hidden");
 nx.textContent=st.i+1<st.list.length?"السؤال التالي":"عرض النتيجة";
 nx.onclick=()=>{st.i++;st.i<st.list.length?show():end()};
 nx.focus();
}
function end(){
 saveBest(st.score);beep([523,659,784]);
 const p=st.right/st.list.length;
 const rk=p===1?"أسطورة الملاعب":p>=.8?"نجم الفريق":p>=.6?"لاعب أساسي":p>=.4?"لاعب احتياطي":"ناشئ يتعلم";
 app.innerHTML=`<div class="hero final">${pitch}<p style="margin:0">صافرة النهاية</p><h1 class="kufi">${rk}</h1></div>
 <div class="board final"><div class="cell" style="grid-column:1/3"><small>مجموع النقاط</small><div class="dig">${st.score}</div></div></div>
 ${strip().replace("cur","")}
 <div class="stats"><div><b>${st.right}/${st.list.length}</b><span>إجابات صحيحة</span></div><div><b>${st.maxStreak}</b><span>أطول سلسلة</span></div><div><b>${best()}</b><span>أفضل نتيجة</span></div></div>
 <div class="row"><button class="primary" id="ag">جولة جديدة</button><button class="ghost" id="hm">القائمة الرئيسية</button></div>`;
 document.getElementById("ag").onclick=()=>start(st.mode);
 document.getElementById("hm").onclick=intro;
}
document.addEventListener("keydown",e=>{
 const o=document.querySelectorAll(".opt");
 if(o.length&&!st.done&&/^[1-4]$/.test(e.key))o[+e.key-1].click();
});
applyTheme();intro();
</script>
</body>
</html>
